name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m unittest discover -s tests/unit -v
      - run: python -m build
      - run: python scripts/build_release.py
      - name: Smoke test an installed wheel outside the checkout
        shell: bash
        run: |
          python -m venv /tmp/dollyzoom-smoke
          /tmp/dollyzoom-smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/dollyzoom-smoke/bin/dollyzoom --version
          /tmp/dollyzoom-smoke/bin/dollyzoom schema
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.13'
        with:
          name: dollyzoom-builds
          path: dist/
